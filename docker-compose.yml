services:
  n8n:
    image: n8nio/n8n:latest
    container_name: cityjoblink-n8n
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://localhost:5678/
      - GENERIC_TIMEZONE=Asia/Manila
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=admin
      - N8N_BASIC_AUTH_PASSWORD=admin123
      # Allow Code node access to $env.* for OCR/callback configuration
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
      # OCR.Space key used by seeker-id-verification-workflow.json.
      # `helloworld` works only for basic testing; set OCR_SPACE_API_KEY in your shell for real use.
      - OCR_SPACE_API_KEY=${OCR_SPACE_API_KEY:-helloworld}
      - N8N_SEEKER_ID_VERIFICATION_CALLBACK_SECRET=791a522f2ac54182996403fbb95b5e0f58f6942d10414df1bf49e1e61ac7cc38
    volumes:
      - n8n_data:/home/node/.n8n

volumes:
  n8n_data: